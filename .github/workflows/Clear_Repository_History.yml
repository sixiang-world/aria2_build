name: Clear Repository History

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "危险操作：输入 CLEAR-HISTORY 以确认清空默认分支历史（仅允许在默认分支触发）"
        type: string
        required: true
        default: ""

permissions:
  contents: read

jobs:
  clear-history:
    if: inputs.confirm == 'CLEAR-HISTORY' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Clear repository history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          git checkout --orphan latest-work
          git add -A
          git commit -m "Initial commit"
          git branch -D "$DEFAULT_BRANCH"
          git branch -m "$DEFAULT_BRANCH"
          git push -u origin "$DEFAULT_BRANCH" --force
