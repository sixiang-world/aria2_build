name: "Aria2 Lite Build"

on:
  workflow_dispatch:
    inputs:
      aria2_ref:
        description: "上游分支、标签、完整提交 SHA 或版本号（留空使用锁定提交）"
        type: string
        default: ""
      target:
        description: "目标平台"
        type: choice
        default: linux-x86_64
        options: [all, linux-x86_64, linux-aarch64]
      patch_mode:
        description: "patched 应用增强补丁，vanilla 保留上游源码"
        type: choice
        default: patched
        options: [patched, vanilla]
      enable_static:
        description: "静态链接"
        type: boolean
        default: true
      extra_configure_flags:
        description: "附加 configure 参数（以空格分隔）"
        type: string
        default: ""
  push:
    branches: [master]
    paths:
      - "build-aux/aria2.commit"
      - "build-aux/dependencies.tsv"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/lite.yml"
      - ".github/workflows/lite-build.yml"
      - ".github/workflows/prepare-source.yml"
  pull_request:
    paths:
      - "build-aux/aria2.commit"
      - "build-aux/dependencies.tsv"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/lite.yml"
      - ".github/workflows/lite-build.yml"
      - ".github/workflows/prepare-source.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  source:
    uses: ./.github/workflows/prepare-source.yml
    with:
      aria2_ref: ${{ inputs.aria2_ref || '' }}
      patch_mode: ${{ inputs.patch_mode || 'patched' }}

  build:
    needs: source
    uses: ./.github/workflows/lite-build.yml
    with:
      aria2_commit: ${{ needs.source.outputs.commit }}
      aria2_version: ${{ needs.source.outputs.version }}
      aria2_source_archive: ${{ needs.source.outputs.archive }}
      aria2_source_sha256: ${{ needs.source.outputs.checksum }}
      patch_mode: ${{ inputs.patch_mode || 'patched' }}
      target: ${{ inputs.target || 'all' }}
      enable_static: ${{ toJSON(inputs.enable_static) != 'false' }}
      extra_configure_flags: ${{ inputs.extra_configure_flags || '' }}
