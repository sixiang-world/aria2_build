name: "Aria2 Full Build"

on:
  workflow_dispatch:
    inputs:
      aria2_ref:
        description: "上游分支、标签、完整提交 SHA 或版本号（留空使用锁定提交）"
        type: string
        default: ""
      target:
        description: "目标平台"
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-w64-mingw32
          - arm-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          - loongarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - i686-w64-mingw32
          - mips-unknown-linux-musl
          - mipsel-unknown-linux-musl
          - mips64-unknown-linux-musl
          - mips64el-unknown-linux-musl
          - macos-arm64
      patch_mode:
        description: "patched 应用增强补丁，vanilla 保留上游源码"
        type: choice
        default: patched
        options: [patched, vanilla]
      enable_zlib_ng:
        description: "使用 zlib-ng 替代 zlib"
        type: boolean
        default: true
      tls_backend:
        description: "TLS 后端（WinTLS 仅用于 Windows，macOS 固定为 AppleTLS）"
        type: choice
        default: openssl
        options: [openssl, libressl, wintls]
      exclude_patches:
        description: "跳过的四位补丁编号，以逗号分隔（例如 0001,0022）"
        type: string
        default: ""
      extra_configure_flags:
        description: "附加 configure 参数，支持引号"
        type: string
        default: ""
      compiler_opt:
        description: "编译器优化级别"
        type: choice
        default: "-O2"
        options: ["-O2", "-O3", "-Os"]
      run_tests:
        description: "运行测试（关闭后只能下载构建产物）"
        type: boolean
        default: true
      publish_release:
        description: "使用默认分支和默认构建参数发布正式版"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "build.sh"
      - "build-aux/**"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/full.yml"
      - ".github/workflows/full-build.yml"
      - ".github/workflows/prepare-source.yml"
  pull_request:
    paths:
      - "build.sh"
      - "build-aux/**"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/full.yml"
      - ".github/workflows/full-build.yml"
      - ".github/workflows/prepare-source.yml"
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  source:
    uses: ./.github/workflows/prepare-source.yml
    with:
      aria2_ref: ${{ inputs.aria2_ref || '' }}
      patch_mode: ${{ inputs.patch_mode || 'patched' }}
      exclude_patches: ${{ inputs.exclude_patches || '' }}

  build:
    needs: source
    uses: ./.github/workflows/full-build.yml
    with:
      aria2_commit: ${{ needs.source.outputs.commit }}
      aria2_version: ${{ needs.source.outputs.version }}
      aria2_source_archive: ${{ needs.source.outputs.archive }}
      aria2_source_sha256: ${{ needs.source.outputs.checksum }}
      patch_mode: ${{ inputs.patch_mode || 'patched' }}
      target: ${{ inputs.target || 'all' }}
      enable_zlib_ng: ${{ toJSON(inputs.enable_zlib_ng) != 'false' }}
      tls_backend: ${{ inputs.tls_backend || 'openssl' }}
      exclude_patches: ${{ inputs.exclude_patches || '' }}
      extra_configure_flags: ${{ inputs.extra_configure_flags || '' }}
      compiler_opt: ${{ inputs.compiler_opt || '-O2' }}
      run_tests: ${{ toJSON(inputs.run_tests) != 'false' }}

  release:
    needs: [source, build]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release
      && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
      && inputs.run_tests && inputs.target == 'all' && inputs.patch_mode == 'patched' && inputs.aria2_ref == ''
      && inputs.enable_zlib_ng && inputs.tls_backend == 'openssl' && inputs.exclude_patches == ''
      && inputs.extra_configure_flags == '' && inputs.compiler_opt == '-O2')
    runs-on: ubuntu-24.04
    concurrency:
      group: aria2-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-full-verified
          path: release
      - name: Publish verified assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARIA2_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$(python3 scripts/update-scoop-manifest.py next-tag --aria2-version "$ARIA2_VERSION")"
            gh release create "$tag" release/* --title "Aria2 ${tag#v}" \
              --notes-file release/build_info.md --latest --target "$GITHUB_SHA"
          else
            gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$tag" release/*
          fi
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}\.[0-9]+$ ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Update the Scoop manifest
        if: steps.publish.outputs.tag != ''
        env:
          ARIA2_VERSION: ${{ needs.source.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          git pull --ff-only origin "$DEFAULT_BRANCH"
          python3 scripts/update-scoop-manifest.py update --tag "$RELEASE_TAG" \
            --aria2-version "$ARIA2_VERSION" --checksums release/SHA256SUMS --manifest bucket/aria2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/aria2.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Scoop manifest for $RELEASE_TAG"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH" || {
              git pull --rebase origin "$DEFAULT_BRANCH"
              git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
            }
          fi
