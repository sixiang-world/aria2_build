name: "Aria2 Full Build"

on:
  workflow_dispatch:
    inputs:
      aria2_ref:
        description: "Aria2 源码版本（tag 如 1.37.0，或 branch 如 master）"
        required: false
        default: "master"
      target:
        description: "目标平台（留空则构建全部）"
        required: false
        type: choice
        options:
          - all
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-w64-mingw32
          - arm-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          - loongarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - i686-w64-mingw32
          - mips-unknown-linux-musl
          - mipsel-unknown-linux-musl
          - mips64-unknown-linux-musl
          - mips64el-unknown-linux-musl
      enable_zlib_ng:
        description: "使用 zlib-ng 替代 zlib（true/false）"
        required: false
        default: "true"
      enable_libressl:
        description: "使用 LibreSSL 替代 OpenSSL（true/false）"
        required: false
        default: "false"
  schedule:
    - cron: "0 3 * * 1"  # 每周一 UTC 时间 03:00 运行
  release:
    types:
      - released

jobs:
  # ============================================================================
  # Linux musl 静态构建（Docker 交叉编译）
  # ============================================================================
  static-build-linux:
    runs-on: ubuntu-latest
    container: "ghcr.io/abcfy2/clang-cross-toolchain-ubuntu:${{ matrix.cross_host }}"
    strategy:
      fail-fast: false
      matrix:
        cross_host: ${{ fromJSON((github.event.inputs.target == 'all' || github.event.inputs.target == '' || github.event.inputs.target == null) && '["arm-unknown-linux-musleabi","armv7-unknown-linux-musleabihf","aarch64-unknown-linux-musl","loongarch64-unknown-linux-musl","x86_64-unknown-linux-musl","i686-unknown-linux-musl","mips-unknown-linux-musl","mipsel-unknown-linux-musl","mips64-unknown-linux-musl","mips64el-unknown-linux-musl"]' || format('["{0}"]', github.event.inputs.target)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/cache@v5
        id: cache
        with:
          path: downloads/
          key: build-cache-${{ matrix.cross_host }}-${{ github.sha }}-${{ github.event_name }}
          restore-keys: |
            build-cache-${{ matrix.cross_host }}-${{ github.sha }}-
            build-cache-${{ matrix.cross_host }}-
      - name: Configure git identity
        run: |
          apt-get update && apt-get install -y git
          git config --global user.email "build@aria2-build"
          git config --global user.name "Aria2 Build"
      - name: Compile
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
          USE_LIBRESSL: "${{ github.event.inputs.enable_libressl || '0' }}"
          USE_ZLIB_NG: "${{ github.event.inputs.enable_zlib_ng || '1' }}"
          ARIA2_VER: "${{ github.event.inputs.aria2_ref || '' }}"
        run: |
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            export ARIA2_VER="${GITHUB_REF#refs/*/}"
            ARIA2_VER="${ARIA2_VER#v}"
            echo "ARIA2_VER=${ARIA2_VER}" >> $GITHUB_ENV
          fi
          chmod +x "${GITHUB_WORKSPACE}/build.sh"
          "${GITHUB_WORKSPACE}/build.sh"

      # ---- 测试阶段：在容器内用 QEMU 运行编译产物 ----
      - name: Determine test runner
        id: runner
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
        run: |
          # build.sh 已安装 qemu-user；根据目标架构选择 runner
          case "${CROSS_HOST}" in
            x86_64*linux*|i?86*linux*)
              # x86_64 / i686 musl 静态二进制可在 x86_64 宿主原生运行
              echo "runner=" >> "$GITHUB_OUTPUT"
              ;;
            aarch64*linux*)
              echo "runner=qemu-aarch64" >> "$GITHUB_OUTPUT"
              ;;
            armv7*linux*)
              echo "runner=qemu-arm" >> "$GITHUB_OUTPUT"
              ;;
            arm*linux*)
              echo "runner=qemu-arm" >> "$GITHUB_OUTPUT"
              ;;
            loongarch64*linux*)
              # loongarch64 qemu 可能不存在；尝试检测
              if command -v qemu-loongarch64 >/dev/null 2>&1; then
                echo "runner=qemu-loongarch64" >> "$GITHUB_OUTPUT"
              else
                echo "runner=" >> "$GITHUB_OUTPUT"
                echo "skip_runtime=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            mips64*linux*|mips*linux*)
              # MIPS 运行时测试会挂起（上游 build.sh 已知问题），跳过运行时测试
              echo "runner=" >> "$GITHUB_OUTPUT"
              echo "skip_runtime=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "runner=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run comprehensive tests
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
          TEST_RUNNER: "${{ steps.runner.outputs.runner }}"
          SKIP_RUNTIME: "${{ steps.runner.outputs.skip_runtime }}"
        run: |
          apt-get update && apt-get install -y file curl 2>/dev/null || true
          chmod +x "${GITHUB_WORKSPACE}/scripts/test.sh"

          BINARY="$(ls "${GITHUB_WORKSPACE}"/aria2c* 2>/dev/null | head -1)"
          if [ -z "$BINARY" ]; then
            echo "❌ 未找到构建产物 aria2c*"
            exit 1
          fi
          echo "测试二进制：$BINARY"

          if [ "$SKIP_RUNTIME" = "true" ]; then
            echo "⚠️ loongarch64 无可用 QEMU，仅做架构检查"
            # 仅验证文件存在和架构
            file "$BINARY"
            echo "✅ 跳过运行时测试（无 QEMU）"
          else
            "${GITHUB_WORKSPACE}/scripts/test.sh" "$BINARY" \
              --runner "${TEST_RUNNER}" \
              --target "${CROSS_HOST}"
          fi

      - name: Zip archiving
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
        run: |
          apt update && apt install -y zip curl

          ARIA2_VERSION=$(curl -s https://api.github.com/repos/aria2/aria2/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")' | sed 's/release-//')

          if [ -z "${ARIA2_VERSION}" ] && [ -n "${ARIA2_VER}" ]; then
            ARIA2_VERSION="${ARIA2_VER}"
          fi

          if [ x"${USE_LIBRESSL}" = x"1" ]; then
            ARCHIVE_NAME="aria2-${ARIA2_VERSION}-${CROSS_HOST//-unknown/}_libressl_static.zip"
          else
            ARCHIVE_NAME="aria2-${ARIA2_VERSION}-${CROSS_HOST//-unknown/}_static.zip"
          fi
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          zip -j9v "/tmp/${ARCHIVE_NAME}" "${GITHUB_WORKSPACE}"/aria2c*
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-${{ matrix.cross_host }}
          path: |
            /tmp/${{ env.ARCHIVE_NAME }}
            build_info.md

  # ============================================================================
  # Windows MinGW 交叉构建（Docker）
  # ============================================================================
  static-build-mingw:
    runs-on: ubuntu-latest
    container: "ghcr.io/abcfy2/mingw-cross-toolchain-ubuntu:${{ matrix.cross_host }}"
    strategy:
      fail-fast: false
      matrix:
        cross_host: ${{ fromJSON((github.event.inputs.target == 'all' || github.event.inputs.target == '' || github.event.inputs.target == null) && '["x86_64-w64-mingw32","i686-w64-mingw32"]' || (contains(fromJSON('["x86_64-w64-mingw32","i686-w64-mingw32"]'), github.event.inputs.target) && format('["{0}"]', github.event.inputs.target) || '[]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/cache@v5
        id: cache
        with:
          path: downloads/
          key: build-cache-${{ matrix.cross_host }}-${{ github.sha }}-${{ github.event_name }}
          restore-keys: |
            build-cache-${{ matrix.cross_host }}-${{ github.sha }}-
            build-cache-${{ matrix.cross_host }}-
      - name: Configure git identity
        run: |
          apt-get update && apt-get install -y git
          git config --global user.email "build@aria2-build"
          git config --global user.name "Aria2 Build"
      - name: Compile
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
          USE_LIBRESSL: "${{ github.event.inputs.enable_libressl || '0' }}"
          USE_ZLIB_NG: "${{ github.event.inputs.enable_zlib_ng || '1' }}"
          ARIA2_VER: "${{ github.event.inputs.aria2_ref || '' }}"
        run: |
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            export ARIA2_VER="${GITHUB_REF#refs/*/}"
            ARIA2_VER="${ARIA2_VER#v}"
            echo "ARIA2_VER=${ARIA2_VER}" >> $GITHUB_ENV
          fi
          chmod +x "${GITHUB_WORKSPACE}/build.sh"
          "${GITHUB_WORKSPACE}/build.sh"

      # ---- 测试阶段：在容器内用 Wine 运行 .exe ----
      - name: Run comprehensive tests (Wine)
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
        run: |
          apt-get update && apt-get install -y file curl 2>/dev/null || true
          # build.sh 已安装 wine；确保 WINEPREFIX
          export WINEPREFIX=/tmp/
          chmod +x "${GITHUB_WORKSPACE}/scripts/test.sh"

          BINARY="$(ls "${GITHUB_WORKSPACE}"/aria2c* 2>/dev/null | head -1)"
          if [ -z "$BINARY" ]; then
            echo "❌ 未找到构建产物 aria2c*"
            exit 1
          fi
          echo "测试二进制：$BINARY（Wine 模式）"

          "${GITHUB_WORKSPACE}/scripts/test.sh" "$BINARY" \
            --runner wine \
            --target "${CROSS_HOST}"

      - name: Zip archiving
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
        run: |
          apt update && apt install -y zip curl

          ARIA2_VERSION=$(curl -s https://api.github.com/repos/aria2/aria2/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")' | sed 's/release-//')

          if [ -z "${ARIA2_VERSION}" ] && [ -n "${ARIA2_VER}" ]; then
            ARIA2_VERSION="${ARIA2_VER}"
          fi

          if [ x"${USE_LIBRESSL}" = x"1" ]; then
            ARCHIVE_NAME="aria2-${ARIA2_VERSION}-${CROSS_HOST//-unknown/}_libressl_static.zip"
          else
            ARCHIVE_NAME="aria2-${ARIA2_VERSION}-${CROSS_HOST//-unknown/}_static.zip"
          fi
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          zip -j9v "/tmp/${ARCHIVE_NAME}" "${GITHUB_WORKSPACE}"/aria2c*
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-${{ matrix.cross_host }}
          path: |
            /tmp/${{ env.ARCHIVE_NAME }}
            build_info.md

  # ============================================================================
  # macOS arm64 构建（AppleTLS）
  # ============================================================================
  build-on-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            arch_name: arm64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew update
          brew install automake autoconf libtool pkg-config
          brew install libssh2 zlib sqlite3 c-ares libxml2 nettle gmp cppunit

      - name: Build aria2
        run: |
          git clone https://github.com/aria2/aria2.git
          cd aria2
          if [ -d "$GITHUB_WORKSPACE/patch" ]; then
            for patch_file in $GITHUB_WORKSPACE/patch/*.patch; do
              patch -p1 < "$patch_file" || exit 1
            done
          fi
          export LDFLAGS="-L/opt/homebrew/lib"
          export CPPFLAGS="-I/opt/homebrew/include"
          autoreconf -ivf
          ./configure \
            --enable-static \
            --disable-shared \
            --with-appletls \
            --with-libz \
            --with-libcares \
            --with-sqlite3 \
            --with-libxml2 \
            --with-libgmp \
            --with-libnettle \
            --with-libssh2 \
            --enable-metalink \
            --enable-bittorrent \
            --enable-websocket \
            --disable-nls \
            --without-libintl-prefix \
            ARIA2_STATIC=yes
          sed -i '' 's/ po / /' Makefile
          make -j$(sysctl -n hw.ncpu)

      # ---- 测试阶段：原生运行 + 综合测试脚本 ----
      - name: Run comprehensive tests
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/test.sh"
          "$GITHUB_WORKSPACE/scripts/test.sh" aria2/src/aria2c \
            --target "${{ matrix.arch_name }}"

      - name: Package aria2 binary
        run: |
          mkdir -p release
          ARIA2_VERSION=$(aria2/src/aria2c --version | head -n 1 | awk '{print $3}')
          echo "Extracted ARIA2_VERSION: $ARIA2_VERSION"

          BINARY_NAME="aria2-${ARIA2_VERSION}-${{ matrix.arch }}-macos-dynamic"
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

          ARIA2_VER_INFO="$(aria2/src/aria2c --version 2>/dev/null)"

          BUILD_INFO="release/$BINARY_NAME.md"
          echo "## Build Info - ${{ matrix.arch }} With AppleTLS for MacOS (${{ matrix.arch_name }})" >"${BUILD_INFO}"
          echo "Building using these dependencies:" >>"${BUILD_INFO}"
          echo '```bash' >>"${BUILD_INFO}"
          echo "brew install libssh2 zlib sqlite3 c-ares libxml2 nettle gmp" >>"${BUILD_INFO}"
          echo '```' >>"${BUILD_INFO}"
          echo "- libssh2: $(pkg-config --modversion libssh2)" >> "$BUILD_INFO"
          echo "- zlib: $(pkg-config --modversion zlib)" >> "$BUILD_INFO"
          echo "- sqlite3: $(pkg-config --modversion sqlite3)" >> "$BUILD_INFO"
          echo "- libcares: $(pkg-config --modversion libcares)" >> "$BUILD_INFO"
          echo "- libxml2: $(pkg-config --modversion libxml-2.0)" >> "$BUILD_INFO"
          echo "- nettle: $(pkg-config --modversion nettle)" >> "$BUILD_INFO"
          echo "- gmp: $(pkg-config --modversion gmp)" >> "$BUILD_INFO"
          echo >>"${BUILD_INFO}"
          echo "aria2 version info:" >>"${BUILD_INFO}"
          echo '```txt' >>"${BUILD_INFO}"
          echo "${ARIA2_VER_INFO}" >>"${BUILD_INFO}"
          echo '```' >>"${BUILD_INFO}"
          echo "aria2 binary info:" >>"${BUILD_INFO}"
          echo '```txt' >>"${BUILD_INFO}"
          echo "$(file aria2/src/aria2c)" >> "${BUILD_INFO}"
          echo '```' >>"${BUILD_INFO}"

          zip -j9v "release/$BINARY_NAME.zip" aria2/src/aria2c

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}
          path: |
            release/

  # ============================================================================
  # 跨产物验证：下载所有 artifact 做最终一致性检查
  # ============================================================================
  verify-artifacts:
    needs: [static-build-linux, static-build-mingw, build-on-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: aria2-*

      - name: Verify artifact integrity
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║        跨产物完整性验证                           ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "已下载的 artifacts："
          find artifacts/ -type f | sort
          echo ""

          FAIL=0
          # 检查每个 zip 是否有效
          for zip_file in $(find artifacts/ -name "*.zip" -type f); do
            echo "--- 验证：$zip_file"
            if unzip -t "$zip_file" >/dev/null 2>&1; then
              SIZE=$(du -h "$zip_file" | cut -f1)
              echo "  ✅ ZIP 有效，大小 $SIZE"
            else
              echo "  ❌ ZIP 损坏：$zip_file"
              FAIL=1
            fi
          done

          # 检查至少有一个 aria2 二进制
          BINARY_COUNT=$(find artifacts/ -name "*.zip" -type f | wc -l)
          echo ""
          echo "产物总数：$BINARY_COUNT"
          if [ "$BINARY_COUNT" -eq 0 ]; then
            echo "❌ 没有任何构建产物"
            FAIL=1
          fi

          echo ""
          if [ "$FAIL" -ne 0 ]; then
            echo "══════════════════════════════════════════════════"
            echo "❌ 产物验证失败"
            exit 1
          fi
          echo "🎉 所有产物验证通过！"
          echo "══════════════════════════════════════════════════"

  # ============================================================================
  # 预发布（定时 / 手动触发）
  # ============================================================================
  prerelease:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [static-build-linux, static-build-mingw, build-on-macos, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: aria2-*

      - name: Merge and clean .md files
        run: |
          mkdir -p release

          echo "List of downloaded artifacts:"
          ls -laR artifacts/

          find artifacts/ -name "*.zip" -exec cp {} release/ \;

          touch release/build_info.txt
          NOW=$(date --utc)
          echo "NOW=$NOW"
          cat <<EOF > release/build_info.txt
          Building time: ${NOW}
          - - -
          EOF

          find artifacts/ -name "*.md" -type f | while read -r file; do
            if [[ -f "$file" ]]; then
              echo "Appending content of $file to build_info.txt"
              cat "$file" >> release/build_info.txt
              echo "" >> release/build_info.txt
            fi
          done

          mv release/build_info.txt release/build_info.md

          echo "Final list of files in release directory:"
          ls -laR release/

      - name: Prepare and Create Prerelease
        run: |
          gh release delete continuous --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Prerelease Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.zip
          prerelease: true
          draft: false
          tag_name: continuous
          name: Continuous build
          body_path: release/build_info.md
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 正式发布（Release 事件触发）
  # ============================================================================
  release:
    if: github.event_name == 'release'
    needs: [static-build-linux, static-build-mingw, build-on-macos, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: aria2-*

      - name: Merge and clean .md files
        run: |
          mkdir -p release

          echo "List of downloaded artifacts:"
          ls -laR artifacts/

          find artifacts/ -name "*.zip" -exec cp {} release/ \;

          touch release/build_info.txt
          find artifacts/ -name "*.md" -type f | while read -r file; do
            if [[ -f "$file" ]]; then
              echo "Appending content of $file to build_info.txt"
              cat "$file" >> release/build_info.txt
              echo "" >> release/build_info.txt
            fi
          done

          mv release/build_info.txt release/build_info.md

          echo "Final list of files in release directory:"
          ls -laR release/

      - name: Delete existing release and tag if they exist
        run: |
          ARIA2_VER=$(curl -s https://api.github.com/repos/aria2/aria2/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")' | sed 's/release-//')
          echo "ARIA2 version: $ARIA2_VER"
          echo "ARIA2_VER=${ARIA2_VER}" >> $GITHUB_ENV

          RELEASE_ID=$(gh api -H "Accept: application/vnd.github.v3+json" "repos/${{ github.repository }}/releases/tags/v${ARIA2_VER}" -q .id)
          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing release with tag v${ARIA2_VER} (ID: $RELEASE_ID)..."
            gh release delete "v${ARIA2_VER}" --cleanup-tag
          else
            echo "No release found with tag v${ARIA2_VER}. Skipping deletion."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.ARIA2_VER }}
          name: Aria2 v${{ env.ARIA2_VER }} static
          body_path: release/build_info.md
          draft: false
          prerelease: false
          files: |
            release/*.zip

  # ============================================================================
  # 清理旧 workflow 运行记录
  # ============================================================================
  del_runs:
    needs: [static-build-linux, static-build-mingw, build-on-macos, verify-artifacts, prerelease, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
