name: "Aria2 Lite Build"

on:
  workflow_dispatch:
    inputs:
      aria2_ref:
        description: "Aria2 源码分支 / Tag / Commit（留空则使用 master）"
        required: false
        default: "master"
      target:
        description: "目标平台"
        required: false
        default: "linux-x86_64"
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
      enable_static:
        description: "是否静态编译（true/false）"
        required: false
        default: "true"
      extra_configure_flags:
        description: "附加 configure 参数（可留空）"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"  # 每周一 UTC 时间 03:00 运行

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake autopoint libtool pkg-config \
            libcppunit-dev libssl-dev zlib1g-dev libc-ares-dev \
            libsqlite3-dev libssh2-1-dev libgmp-dev libgcrypt20-dev \
            gettext git ca-certificates curl file

          # aarch64 交叉编译需要专属工具链（修复 code-review.md §5）
          if [ "${{ matrix.target }}" = "linux-aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libc6-dev-arm64-cross
          fi

      - name: Clone latest Aria2 source
        run: |
          ARIA2_REF="${{ github.event.inputs.aria2_ref || 'master' }}"
          git clone --depth 1 --branch "$ARIA2_REF" \
            https://github.com/aria2/aria2.git aria2-src
          echo "ARIA2_COMMIT=$(git -C aria2-src rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ARIA2_REF=${ARIA2_REF}" >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          git config --global user.email "build@aria2-build"
          git config --global user.name "Aria2 Build"

      - name: Apply patches
        working-directory: aria2-src
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/patch"
          if [ -d "$PATCH_DIR" ]; then
            for patch in ${PATCH_DIR}/*.patch; do
              git am --3way "$patch" || git am --3way --reject "$patch" || true
            done
          fi

      - name: Configure
        working-directory: aria2-src
        run: |
          TARGET="${{ matrix.target }}"
          ENABLE_STATIC="${{ github.event.inputs.enable_static || 'true' }}"
          EXTRA_CONFIGURE_FLAGS="${{ github.event.inputs.extra_configure_flags || '' }}"

          CONFIGURE_FLAGS="--without-gnutls --with-openssl \
            --without-libxml2 --with-libexpat=no --with-libxml2=no \
            --enable-libaria2"

          case "$TARGET" in
            linux-x86_64)
              CONFIGURE_FLAGS="$CONFIGURE_FLAGS --with-libcares --with-sqlite3 --with-libssh2 --with-libgmp --with-libgcrypt"
              ;;
            linux-aarch64)
              CONFIGURE_FLAGS="$CONFIGURE_FLAGS --with-libcares --with-sqlite3 --with-libssh2 --with-libgmp --with-libgcrypt --host=aarch64-linux-gnu"
              ;;
          esac

          if [ "$ENABLE_STATIC" = "true" ]; then
            CONFIGURE_FLAGS="$CONFIGURE_FLAGS LDFLAGS=-static"
          fi

          autoreconf -i
          ./configure $CONFIGURE_FLAGS $EXTRA_CONFIGURE_FLAGS

      - name: Build
        working-directory: aria2-src
        run: |
          make -j$(nproc)

      # ---- 测试阶段 ----
      - name: Run comprehensive tests
        run: |
          TARGET="${{ matrix.target }}"
          chmod +x "${GITHUB_WORKSPACE}/scripts/test.sh"

          BINARY="aria2-src/src/aria2c"
          if [ ! -f "$BINARY" ]; then
            echo "❌ 构建产物不存在：$BINARY"
            exit 1
          fi

          if [ "$TARGET" = "linux-aarch64" ]; then
            # aarch64 交叉编译产物需要 QEMU 运行
            sudo apt-get install -y qemu-user-static
            echo "测试 aarch64 二进制（via qemu-aarch64）"
            "${GITHUB_WORKSPACE}/scripts/test.sh" "$BINARY" \
              --runner qemu-aarch64-static \
              --target aarch64-unknown-linux-gnu
          else
            echo "测试 x86_64 二进制（原生）"
            "${GITHUB_WORKSPACE}/scripts/test.sh" "$BINARY" \
              --target x86_64-unknown-linux-gnu
          fi

      - name: Package
        id: package
        run: |
          TARGET="${{ matrix.target }}"
          ARIA2_VERSION=$(aria2-src/src/aria2c --version | head -n 1 | awk '{print $3}')

          mkdir -p release

          case "$TARGET" in
            linux-x86_64)
              BINARY_NAME="aria2-${ARIA2_VERSION}-linux-x86_64-lite"
              cp aria2-src/src/aria2c "release/${BINARY_NAME}"
              ;;
            linux-aarch64)
              BINARY_NAME="aria2-${ARIA2_VERSION}-linux-aarch64-lite"
              cp aria2-src/src/aria2c "release/${BINARY_NAME}"
              ;;
          esac

          echo "BINARY_NAME=${BINARY_NAME}" >> "$GITHUB_ENV"
          echo "ARIA2_VERSION=${ARIA2_VERSION}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}
          path: |
            release/

  # ============================================================================
  # 预发布（修复 code-review.md §4：用 body_path 替代不会被求值的 body 字面量）
  # ============================================================================
  prerelease:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: aria2-*

      - name: Prepare release body
        id: body
        run: |
          mkdir -p release

          # 复制所有产物
          find artifacts/ -type f -exec cp {} release/ \;

          # 生成真实有效的 release body（解决 $(date) 字面量 + 不存在的 outputs 问题）
          NOW=$(date --utc)
          cat > release/body.md <<EOF
          ## Aria2 Lite Build

          这是轻量级构建版本，使用系统包快速编译。

          - 构建时间: ${NOW}
          - Aria2 源码: master（最新）
          - 已通过综合测试（版本/架构/魔改默认值/HTTP 下载/静态链接）
          EOF

      - name: Prepare and Create Prerelease
        run: |
          # 删除已存在的 continuous-lite release 和 tag
          gh release delete continuous-lite --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Prerelease Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/aria2-*
          prerelease: true
          draft: false
          tag_name: continuous-lite
          name: Continuous Lite build
          body_path: release/body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
