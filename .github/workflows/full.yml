name: "Aria2 Full Build"

on:
  workflow_dispatch:
    inputs:
      aria2_ref:
        description: "上游分支、标签、完整提交 SHA 或版本号（留空使用锁定提交）"
        type: string
        default: ""
      target:
        description: "目标平台"
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-w64-mingw32
          - arm-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          - loongarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - i686-w64-mingw32
          - mips-unknown-linux-musl
          - mipsel-unknown-linux-musl
          - mips64-unknown-linux-musl
          - mips64el-unknown-linux-musl
          - macos-arm64
      patch_mode:
        description: "patched 应用增强补丁，vanilla 保留上游源码"
        type: choice
        default: patched
        options: [patched, vanilla]
      enable_http_enhancements:
        description: "启用 HTTP 续传校验与同源调度（仅 patched 模式）"
        type: boolean
        default: true
      enable_zlib_ng:
        description: "使用 zlib-ng 替代 zlib"
        type: boolean
        default: true
      tls_backend:
        description: "TLS 后端（WinTLS 仅用于 Windows，macOS 固定为 AppleTLS）"
        type: choice
        default: openssl
        options: [openssl, libressl, wintls]
      exclude_patches:
        description: "跳过的四位补丁编号，以逗号分隔（例如 0001,0022）"
        type: string
        default: ""
      extra_configure_flags:
        description: "附加 configure 参数，支持引号"
        type: string
        default: ""
      compiler_opt:
        description: "编译器优化级别"
        type: choice
        default: "-O2"
        options: ["-O2", "-O3", "-Os"]
      run_tests:
        description: "运行测试（关闭后只能下载构建产物）"
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - "build.sh"
      - "build-aux/**"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/full.yml"
      - ".github/workflows/full-build.yml"
      - ".github/workflows/prepare-source.yml"
  pull_request:
    paths:
      - "build.sh"
      - "build-aux/**"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/full.yml"
      - ".github/workflows/full-build.yml"
      - ".github/workflows/prepare-source.yml"
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  source:
    uses: ./.github/workflows/prepare-source.yml
    with:
      aria2_ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.aria2_ref || '' }}
      patch_mode: ${{ inputs.patch_mode || 'patched' }}
      exclude_patches: ${{ inputs.exclude_patches || '' }}
      enable_http_enhancements: ${{ toJSON(inputs.enable_http_enhancements) != 'false' }}

  build:
    needs: source
    uses: ./.github/workflows/full-build.yml
    with:
      aria2_commit: ${{ needs.source.outputs.commit }}
      aria2_version: ${{ needs.source.outputs.version }}
      aria2_source_archive: ${{ needs.source.outputs.archive }}
      aria2_source_sha256: ${{ needs.source.outputs.checksum }}
      patch_mode: ${{ inputs.patch_mode || 'patched' }}
      target: ${{ inputs.target || 'all' }}
      enable_zlib_ng: ${{ toJSON(inputs.enable_zlib_ng) != 'false' }}
      tls_backend: ${{ inputs.tls_backend || 'openssl' }}
      exclude_patches: ${{ needs.source.outputs.exclude_patches }}
      extra_configure_flags: ${{ inputs.extra_configure_flags || '' }}
      compiler_opt: ${{ inputs.compiler_opt || '-O2' }}
      run_tests: ${{ toJSON(inputs.run_tests) != 'false' }}

  prerelease:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
      && inputs.run_tests && inputs.target == 'all' && inputs.patch_mode == 'patched' && inputs.aria2_ref == ''
      && inputs.enable_http_enhancements && inputs.enable_zlib_ng && inputs.tls_backend == 'openssl'
      && inputs.exclude_patches == ''
      && inputs.extra_configure_flags == '' && inputs.compiler_opt == '-O2'
    runs-on: ubuntu-24.04
    concurrency: aria2-continuous-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-full-verified
          path: release
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          make_latest: false
          body_path: release/build_info.md
          fail_on_unmatched_files: true
          files: release/*

  release:
    needs: build
    if: github.event_name == 'release' && toJSON(inputs.run_tests) != 'false'
    runs-on: ubuntu-24.04
    concurrency: aria2-full-release-${{ github.event.release.tag_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-full-verified
          path: release
      - name: Add verified assets to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" release/*
