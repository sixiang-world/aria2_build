name: "Aria2 Full Build"

on:
  workflow_dispatch:
    inputs:
      aria2_ref:
        description: "上游分支、标签、完整提交 SHA 或版本号（留空使用锁定提交）"
        type: string
        default: ""
      target:
        description: "目标平台"
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-w64-mingw32
          - arm-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          - loongarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - i686-w64-mingw32
          - mips-unknown-linux-musl
          - mipsel-unknown-linux-musl
          - mips64-unknown-linux-musl
          - mips64el-unknown-linux-musl
          - macos-arm64
      patch_mode:
        description: "patched 应用增强补丁，vanilla 保留上游源码"
        type: choice
        default: patched
        options: [patched, vanilla]
      enable_zlib_ng:
        description: "使用 zlib-ng 替代 zlib"
        type: boolean
        default: true
      enable_libressl:
        description: "使用 LibreSSL 替代 OpenSSL"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "build.sh"
      - "build-aux/**"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/full.yml"
      - ".github/workflows/prepare-source.yml"
  pull_request:
    paths:
      - "build.sh"
      - "build-aux/**"
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/full.yml"
      - ".github/workflows/prepare-source.yml"
  schedule:
    - cron: "0 3 * * 1"
  release:
    types: [released]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    uses: ./.github/workflows/prepare-source.yml
    with:
      aria2_ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.aria2_ref || '' }}
      patch_mode: ${{ inputs.patch_mode || 'patched' }}

  plan:
    runs-on: ubuntu-24.04
    outputs:
      static_matrix: ${{ steps.targets.outputs.static_matrix }}
      has_static: ${{ steps.targets.outputs.has_static }}
      has_macos: ${{ steps.targets.outputs.has_macos }}
      artifact_targets: ${{ steps.targets.outputs.artifact_targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select targets and locked toolchain images
        id: targets
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: python3 scripts/full-matrix.py >> "$GITHUB_OUTPUT"

  static-build:
    needs: [source, plan]
    if: needs.plan.outputs.has_static == 'true'
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.static_matrix) }}
    env:
      CROSS_HOST: ${{ matrix.target }}
      TOOLCHAIN_IMAGE: ${{ matrix.image }}
      USE_ZLIB_NG: ${{ github.event.inputs.enable_zlib_ng || 'true' }}
      USE_LIBRESSL: ${{ github.event.inputs.enable_libressl || 'false' }}
      PATCH_MODE: ${{ inputs.patch_mode || 'patched' }}
      ARIA2_COMMIT: ${{ needs.source.outputs.commit }}
      ARIA2_VERSION: ${{ needs.source.outputs.version }}
      ARIA2_SOURCE_ARCHIVE: upstream/${{ needs.source.outputs.archive }}
      ARIA2_SOURCE_SHA256: ${{ needs.source.outputs.checksum }}
      BUILD_OUTPUT_DIR: out
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-source
          path: upstream
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: downloads/
          key: aria2-deps-${{ matrix.target }}-${{ env.USE_ZLIB_NG }}-${{ env.USE_LIBRESSL }}-${{ hashFiles('build-aux/dependencies.tsv') }}
      - name: Build with verified source and dependencies
        run: ./build.sh
      - name: Verify binary and test supported runtime
        run: |
          binary=out/aria2c
          options=(--target "$CROSS_HOST" --patch-mode "$PATCH_MODE")
          case "$CROSS_HOST" in
            *mingw*)
              binary=out/aria2c.exe
              wine_dir="$(mktemp -d)"
              export WINEPREFIX="$wine_dir/prefix"
              export WINEDEBUG=-all
              trap 'rm -rf -- "$wine_dir"' EXIT
              options+=(--runner wine)
              ;;
            *)
              options+=(--require-static)
              case "$CROSS_HOST" in
                aarch64*) options+=(--runner qemu-aarch64) ;;
                arm*) options+=(--runner qemu-arm) ;;
                mips*) options+=(--architecture-only) ;;
                loongarch64*)
                  if command -v qemu-loongarch64 >/dev/null; then
                    options+=(--runner qemu-loongarch64)
                  else
                    options+=(--architecture-only)
                  fi
                  ;;
              esac
              ;;
          esac
          scripts/test.sh "$binary" "${options[@]}"
      - name: Archive binary
        run: |
          mkdir -p release
          binary=out/aria2c
          extra_files=()
          if [[ "$CROSS_HOST" == *mingw* ]]; then
            binary=out/aria2c.exe
            [[ ! -f out/cacert.pem ]] || extra_files+=(out/cacert.pem)
          fi
          variant=
          [[ "$USE_LIBRESSL" != true ]] || variant=_libressl
          [[ "$PATCH_MODE" != vanilla ]] || variant="${variant}_vanilla"
          zip -j9 "release/aria2-$ARIA2_VERSION-${CROSS_HOST/-unknown/}${variant}_static.zip" \
            "$binary" out/COPYING out/LICENSE.OpenSSL out/THIRD-PARTY-NOTICES.txt "${extra_files[@]}"
          mv out/build_info.md release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aria2-bin-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  macos-build:
    needs: [source, plan]
    if: needs.plan.outputs.has_macos == 'true'
    runs-on: macos-15
    env:
      PATCH_MODE: ${{ inputs.patch_mode || 'patched' }}
      USE_ZLIB_NG: ${{ github.event.inputs.enable_zlib_ng || 'true' }}
      USE_LIBRESSL: ${{ github.event.inputs.enable_libressl || 'false' }}
      ARIA2_COMMIT: ${{ needs.source.outputs.commit }}
      ARIA2_VERSION: ${{ needs.source.outputs.version }}
      ARIA2_SOURCE_ARCHIVE: ${{ github.workspace }}/upstream/${{ needs.source.outputs.archive }}
      ARIA2_SOURCE_SHA256: ${{ needs.source.outputs.checksum }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-source
          path: upstream
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: downloads/
          key: aria2-deps-macos-arm64-${{ env.USE_ZLIB_NG }}-${{ env.USE_LIBRESSL }}-${{ hashFiles('build-aux/dependencies.tsv') }}
      - name: Install build-only tools
        run: |
          brew install autoconf automake gettext libtool pkgconf cmake ninja
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: Build self-contained static-deps aria2 against OpenSSL/LibreSSL
        run: |
          set -euo pipefail
          jobs="$(sysctl -n hw.ncpu)"
          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT
          prefix="$work_dir/prefix"
          mkdir -p "$prefix/lib" "$prefix/include" release
          notices="$work_dir/THIRD-PARTY-NOTICES.txt"
          build_info="$PWD/release/build_info.md"
          printf '%s\n' 'Direct third-party libraries statically linked into this macOS aria2 build' > "$notices"
          {
            echo "## Aria2 build for arm64-apple-darwin"
            printf '\n- Aria2 commit: %s\n' "$ARIA2_COMMIT"
            printf -- '- Patch mode: %s\n' "$PATCH_MODE"
            printf -- '- Aria2 source archive SHA-256: %s\n' "$ARIA2_SOURCE_SHA256"
          } > "$build_info"

          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
          unset PKG_CONFIG_PATH
          export CPPFLAGS="-I$prefix/include"
          export LDFLAGS="-L$prefix/lib"
          export CFLAGS="-O2 -fstack-protector-strong"
          export CXXFLAGS="-O2 -fstack-protector-strong"

          archive_for() {
            local dep=$1 archive
            archive="$("$GITHUB_WORKSPACE/scripts/fetch-dependency.sh" "$dep" "$GITHUB_WORKSPACE/downloads")"
            awk -F '\t' -v name="$dep" '$1 == name {printf "- %s %s (SHA-256 %s), source: %s\n", $1, $2, $3, $4}' \
              "$GITHUB_WORKSPACE/build-aux/dependencies.tsv" >> "$build_info"
            printf '%s\n' "$archive"
          }
          unpack() {
            local dep=$1 archive
            archive="$(archive_for "$dep")"
            mkdir -- "$work_dir/$dep"
            tar -xaf "$archive" --strip-components=1 -C "$work_dir/$dep"
            cd -- "$work_dir/$dep"
          }
          append_license() {
            printf '\n===== %s / %s =====\n\n' "$1" "$2" >> "$notices"
            cat "$work_dir/$1/$2" >> "$notices"
            printf '\n' >> "$notices"
          }

          if [[ "$USE_ZLIB_NG" == true || "$USE_ZLIB_NG" == 1 ]]; then
            unpack zlib-ng
            append_license zlib-ng LICENSE.md
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF -DZLIB_COMPAT=ON -DBUILD_TESTING=OFF -DZLIB_ENABLE_TESTS=OFF \
              -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_INSTALL_LIBDIR=lib
            cmake --build build --parallel "$jobs"
            cmake --install build
          else
            unpack zlib
            append_license zlib LICENSE
            ./configure --prefix="$prefix" --static
            make -j"$jobs"
            make install
          fi

          if [[ "$USE_LIBRESSL" == true || "$USE_LIBRESSL" == 1 ]]; then
            unpack libressl
            append_license libressl COPYING
            ./configure --prefix="$prefix" --libdir="$prefix/lib" --enable-static --disable-shared \
              --disable-tests --with-openssldir=/private/etc/ssl
            make -j"$jobs"
            make install
          else
            unpack openssl
            append_license openssl LICENSE.txt
            ./Configure darwin64-arm64-cc --prefix="$prefix" --libdir=lib \
              --openssldir=/private/etc/ssl no-shared no-module no-tests no-apps
            make -j"$jobs" build_sw
            make install_sw
          fi

          unpack libxml2
          append_license libxml2 Copyright
          ./configure --prefix="$prefix" --libdir="$prefix/lib" --enable-static --disable-shared \
            --without-python --without-lzma --without-icu --without-readline --without-history --without-modules --with-zlib
          make -j"$jobs"
          make install

          unpack sqlite
          printf '\n%s\n%s\n' '===== SQLite =====' \
            'SQLite is dedicated to the public domain. See https://www.sqlite.org/copyright.html.' >> "$notices"
          ./configure --prefix="$prefix" --libdir="$prefix/lib" --enable-static --disable-shared
          make -j"$jobs"
          make install

          unpack c-ares
          append_license c-ares LICENSE.md
          ./configure --prefix="$prefix" --libdir="$prefix/lib" --enable-static --disable-shared --disable-tests
          make -j"$jobs"
          make install

          unpack libssh2
          append_license libssh2 COPYING
          for license in "$work_dir/libssh2/LICENSES/"*.txt; do
            append_license libssh2 "LICENSES/${license##*/}"
          done
          autoreconf -fi
          ./configure --prefix="$prefix" --libdir="$prefix/lib" --enable-static --disable-shared \
            --disable-examples-build --with-crypto=openssl
          make -j"$jobs"
          make install

          # Ensure no stray dynamic libraries exist inside isolated prefix.
          find "$prefix/lib" -name '*.dylib' -delete

          cd "$GITHUB_WORKSPACE"
          scripts/aria2-source.sh extract "$ARIA2_SOURCE_ARCHIVE" "$ARIA2_SOURCE_SHA256" aria2-src
          scripts/aria2-source.sh bootstrap aria2-src
          cd aria2-src
          ./configure --disable-nls --enable-static --disable-shared \
            --without-appletls --without-gnutls --with-openssl --with-ca-bundle=/etc/ssl/cert.pem \
            --with-libz --with-libcares --with-sqlite3 --with-libxml2 --with-libssh2 \
            --enable-metalink --enable-bittorrent --enable-websocket
          make -j"$jobs"
          strip -x src/aria2c
          codesign --force -s - src/aria2c
          cp "$notices" "$GITHUB_WORKSPACE/release/THIRD-PARTY-NOTICES.txt"
      - name: Verify self-contained Mach-O linkages, test and package macOS build
        run: |
          binary=aria2-src/src/aria2c
          non_system="$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)' || true)"
          if [[ -n "$non_system" ]]; then
            echo "Unexpected non-system dynamic libraries linked into macOS binary:" >&2
            printf '%s\n' "$non_system" >&2
            exit 1
          fi
          scripts/test.sh "$binary" --target arm64-apple-darwin --patch-mode "$PATCH_MODE"
          variant=
          [[ "$USE_LIBRESSL" != true ]] || variant=_libressl
          [[ "$PATCH_MODE" != vanilla ]] || variant="${variant}_vanilla"
          zip -j9 "release/aria2-$ARIA2_VERSION-arm64-macos${variant}_static.zip" \
            "$binary" aria2-src/COPYING aria2-src/LICENSE.OpenSSL release/THIRD-PARTY-NOTICES.txt
          {
            printf -- '- Binary SHA-256: %s\n' "$(shasum -a 256 "$binary" | cut -d ' ' -f1)"
            otool -L "$binary"
          } >> release/build_info.md
          rm -f release/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aria2-bin-macos-arm64
          path: release/
          if-no-files-found: error

  verify-artifacts:
    needs: [source, plan, static-build, macos-build]
    if: always() && needs.source.result == 'success' && needs.plan.result == 'success' && (needs.static-build.result == 'success' || needs.static-build.result == 'skipped') && (needs.macos-build.result == 'success' || needs.macos-build.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      TARGETS: ${{ needs.plan.outputs.artifact_targets }}
      SOURCE_ARCHIVE: ${{ needs.source.outputs.archive }}
      SOURCE_SHA256: ${{ needs.source.outputs.checksum }}
    steps:
      - name: Download the selected target
        if: ${{ !contains(needs.plan.outputs.artifact_targets, ' ') }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-bin-${{ needs.plan.outputs.artifact_targets }}
          path: artifacts/aria2-bin-${{ needs.plan.outputs.artifact_targets }}
      - name: Download target matrix
        if: contains(needs.plan.outputs.artifact_targets, ' ')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: aria2-bin-*
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-source
          path: release
      - name: Verify every target archive and write manifest
        run: |
          printf '%s  %s\n' "$SOURCE_SHA256" "release/$SOURCE_ARCHIVE" | sha256sum -c
          shopt -s nullglob
          read -r -a targets <<< "$TARGETS"
          test "${#targets[@]}" -gt 0
          for target in "${targets[@]}"; do
            files=("artifacts/aria2-bin-$target/"*.zip)
            test "${#files[@]}" -eq 1
            unzip -tq "${files[0]}"
            cp "${files[0]}" release/
            echo >> release/build_info.md
            cat "artifacts/aria2-bin-$target/build_info.md" >> release/build_info.md
          done
          (cd release && sha256sum -- *.zip "$SOURCE_ARCHIVE" build_info.md > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aria2-full-verified
          path: release/
          if-no-files-found: error

  prerelease:
    needs: verify-artifacts
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.target == 'all' && inputs.patch_mode == 'patched' && inputs.aria2_ref == '' && inputs.enable_zlib_ng && !inputs.enable_libressl)
    runs-on: ubuntu-24.04
    concurrency: aria2-continuous-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-full-verified
          path: release
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          make_latest: false
          body_path: release/build_info.md
          fail_on_unmatched_files: true
          files: release/*

  release:
    needs: verify-artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    concurrency: aria2-full-release-${{ github.event.release.tag_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-full-verified
          path: release
      - name: Add verified assets to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" release/*

  del_runs:
    needs: [verify-artifacts, prerelease]
    if: github.event_name == 'schedule' && needs.prerelease.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
