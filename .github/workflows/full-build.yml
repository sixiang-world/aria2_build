name: "Aria2 Full build gate"

on:
  workflow_call:
    inputs:
      aria2_commit:
        type: string
        required: true
      aria2_version:
        type: string
        required: true
      aria2_source_archive:
        type: string
        required: true
      aria2_source_sha256:
        type: string
        required: true
      target:
        type: string
        default: all
      patch_mode:
        type: string
        default: patched
      enable_zlib_ng:
        type: boolean
        default: true
      tls_backend:
        type: string
        default: openssl
      exclude_patches:
        type: string
      extra_configure_flags:
        type: string
      compiler_opt:
        type: string
        default: "-O2"
      run_tests:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      static_matrix: ${{ steps.targets.outputs.static_matrix }}
      has_static: ${{ steps.targets.outputs.has_static }}
      has_macos: ${{ steps.targets.outputs.has_macos }}
      artifact_targets: ${{ steps.targets.outputs.artifact_targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select targets and locked toolchain images
        id: targets
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: python3 scripts/full-matrix.py >> "$GITHUB_OUTPUT"

  static-build:
    needs: plan
    if: needs.plan.outputs.has_static == 'true'
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.static_matrix) }}
    env:
      CROSS_HOST: ${{ matrix.target }}
      TOOLCHAIN_IMAGE: ${{ matrix.image }}
      USE_ZLIB_NG: ${{ inputs.enable_zlib_ng }}
      TLS_BACKEND: ${{ inputs.tls_backend }}
      RUN_TESTS: ${{ inputs.run_tests }}
      PATCH_MODE: ${{ inputs.patch_mode }}
      EXCLUDE_PATCHES: ${{ inputs.exclude_patches }}
      EXTRA_CONFIGURE_FLAGS: ${{ inputs.extra_configure_flags }}
      COMPILER_OPT: ${{ inputs.compiler_opt }}
      ARIA2_COMMIT: ${{ inputs.aria2_commit }}
      ARIA2_VERSION: ${{ inputs.aria2_version }}
      ARIA2_SOURCE_ARCHIVE: upstream/${{ inputs.aria2_source_archive }}
      ARIA2_SOURCE_SHA256: ${{ inputs.aria2_source_sha256 }}
      BUILD_OUTPUT_DIR: out
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-source
          path: upstream
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: downloads/
          key: aria2-deps-${{ matrix.target }}-${{ env.USE_ZLIB_NG }}-${{ env.TLS_BACKEND }}-${{ hashFiles('build-aux/dependencies.tsv') }}
      - name: Build with verified source and dependencies
        run: ./build.sh
      - name: Archive binary
        run: |
          mkdir -p release
          binary=out/aria2c
          extra_files=()
          variant=
          suffix=_static
          if [[ "$CROSS_HOST" == *mingw* ]]; then
            binary=out/aria2c.exe
            if [[ "$TLS_BACKEND" == wintls ]]; then
              suffix=_static_wintls
            else
              test -f out/cacert.pem
              extra_files+=(out/cacert.pem)
            fi
          fi
          [[ "$TLS_BACKEND" != libressl ]] || variant=_libressl
          [[ "$PATCH_MODE" != vanilla ]] || variant="${variant}_vanilla"
          zip -j9 "release/aria2-$ARIA2_VERSION-${CROSS_HOST/-unknown/}${variant}${suffix}.zip" \
            "$binary" out/COPYING out/LICENSE.OpenSSL out/THIRD-PARTY-NOTICES.txt "${extra_files[@]}"
          mv out/build_info.md release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aria2-full-bin-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          overwrite: true

  macos-build:
    needs: plan
    if: needs.plan.outputs.has_macos == 'true'
    runs-on: macos-15
    env:
      PATCH_MODE: ${{ inputs.patch_mode }}
      EXCLUDE_PATCHES: ${{ inputs.exclude_patches }}
      EXTRA_CONFIGURE_FLAGS: ${{ inputs.extra_configure_flags }}
      COMPILER_OPT: ${{ inputs.compiler_opt }}
      RUN_TESTS: ${{ inputs.run_tests }}
      ARIA2_COMMIT: ${{ inputs.aria2_commit }}
      ARIA2_VERSION: ${{ inputs.aria2_version }}
      ARIA2_SOURCE_ARCHIVE: ${{ github.workspace }}/upstream/${{ inputs.aria2_source_archive }}
      ARIA2_SOURCE_SHA256: ${{ inputs.aria2_source_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-source
          path: upstream
      - name: Install build dependencies
        run: |
          brew install autoconf automake gettext libtool pkg-config libssh2 zlib sqlite3 c-ares libxml2 nettle gmp
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: Build aria2 against AppleTLS
        run: |
          scripts/aria2-source.sh extract "$ARIA2_SOURCE_ARCHIVE" "$ARIA2_SOURCE_SHA256" aria2-src
          scripts/aria2-source.sh bootstrap aria2-src
          for dependency in libssh2 zlib sqlite3 c-ares libxml2 nettle gmp; do
            prefix="$(brew --prefix "$dependency")"
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          done
          gmp_prefix="$(brew --prefix gmp)"
          export CPPFLAGS="-I$gmp_prefix/include ${CPPFLAGS:-}"
          export LDFLAGS="-L$gmp_prefix/lib ${LDFLAGS:-}"
          scripts/aria2-source.sh configure aria2-src \
            --disable-nls --enable-static --disable-shared --with-appletls \
            --without-wintls --without-gnutls --without-openssl \
            --with-libz --with-libcares --with-sqlite3 --with-libxml2 --with-libgmp \
            --with-libnettle --with-libssh2 --enable-metalink --enable-bittorrent --enable-websocket
          make -C aria2-src -j"$(sysctl -n hw.ncpu)"
      - name: Test macOS build
        if: inputs.run_tests
        run: |
          scripts/test.sh aria2-src/src/aria2c --target arm64-apple-darwin \
            --patch-mode "$PATCH_MODE" --exclude-patches "$EXCLUDE_PATCHES"
      - name: Archive macOS binary
        run: |
          binary=aria2-src/src/aria2c
          mkdir -p release
          variant=
          [[ "$PATCH_MODE" != vanilla ]] || variant=-vanilla
          zip -j9 "release/aria2-$ARIA2_VERSION-arm64-macos-dynamic$variant.zip" "$binary" aria2-src/COPYING aria2-src/LICENSE.OpenSSL
          {
            echo "## Aria2 build for arm64-apple-darwin"
            printf '\n- Aria2 commit: %s\n' "$ARIA2_COMMIT"
            printf -- '- Patch mode: %s\n' "$PATCH_MODE"
            printf -- '- Excluded patches: %s\n' "${EXCLUDE_PATCHES:-none}"
            printf -- '- TLS backend: AppleTLS\n'
            printf -- '- Compiler optimization: %s\n' "$COMPILER_OPT"
            printf -- '- Tests enabled: %s\n' "$RUN_TESTS"
            printf -- '- Aria2 source archive SHA-256: %s\n' "$ARIA2_SOURCE_SHA256"
            printf -- '- Binary SHA-256: %s\n' "$(shasum -a 256 "$binary" | cut -d ' ' -f1)"
            brew list --versions libssh2 zlib sqlite3 c-ares libxml2 nettle gmp
            otool -L "$binary"
          } > release/build_info.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aria2-full-bin-macos-arm64
          path: release/
          if-no-files-found: error
          overwrite: true

  verify-artifacts:
    needs: [plan, static-build, macos-build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
        && (needs.plan.outputs.has_static != 'true' || needs.static-build.result == 'success')
        && (needs.plan.outputs.has_macos != 'true' || needs.macos-build.result == 'success') }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_TARGETS: ${{ needs.plan.outputs.artifact_targets }}
      SOURCE_ARCHIVE: ${{ inputs.aria2_source_archive }}
      SOURCE_SHA256: ${{ inputs.aria2_source_sha256 }}
    steps:
      - name: Download the selected target
        if: ${{ !contains(needs.plan.outputs.artifact_targets, ' ') }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-full-bin-${{ needs.plan.outputs.artifact_targets }}
          path: artifacts/aria2-full-bin-${{ needs.plan.outputs.artifact_targets }}
      - name: Download target matrix
        if: contains(needs.plan.outputs.artifact_targets, ' ')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: aria2-full-bin-*
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aria2-source
          path: release
      - name: Verify every target archive and write manifest
        run: |
          printf '%s  %s\n' "$SOURCE_SHA256" "release/$SOURCE_ARCHIVE" | sha256sum -c
          shopt -s nullglob
          read -r -a targets <<< "$ARTIFACT_TARGETS"
          test "${#targets[@]}" -gt 0
          for target in "${targets[@]}"; do
            files=("artifacts/aria2-full-bin-$target/"*.zip)
            test "${#files[@]}" -eq 1
            unzip -tq "${files[0]}"
            cp "${files[0]}" release/
            echo >> release/build_info.md
            cat "artifacts/aria2-full-bin-$target/build_info.md" >> release/build_info.md
          done
          (cd release && sha256sum -- *.zip "$SOURCE_ARCHIVE" build_info.md > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aria2-full-verified
          path: release/
          if-no-files-found: error
          overwrite: true
